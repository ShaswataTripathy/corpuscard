[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corpuscard"
version = "0.1.0"
description = "The card for your training corpus: generate training-data transparency disclosures (EU AI Act Article 53, California AB 2013) from one structured manifest."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Shaswata Tripathy" }]
keywords = ["eu-ai-act", "ab-2013", "compliance", "gpai", "article-53", "training-data-transparency", "model-card"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
estimate = ["tiktoken>=0.7"]

[project.scripts]
corpuscard = "corpuscard.cli:main"

[tool.setuptools.packages.find]
include = ["corpuscard*"]
